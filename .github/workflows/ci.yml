name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config -q
      - name: Build image
        run: docker compose build app
      - name: Run inference smoke test
        run: docker compose run --rm --no-deps app python -c "from backend.main import load_model; load_model(); print('Model loaded successfully')"
