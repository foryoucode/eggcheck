services:
  app:
    build: .
    restart: unless-stopped
    init: true
    expose:
      - "8000"
    environment:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
